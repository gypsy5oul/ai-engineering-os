# Generated against schemas/department-cycle.schema.json.
# The generic contract is policies/department-cycle.json; this instantiates it.
# Edit here, then run: python3 scripts/validate_plugin.py

id: CYCLE-DEV
name: Development execution
version: 1.0.0
department: engineering
description: Story to accepted implementation. The lead decomposes and assigns; the worker implements and validates its own work before anyone looks at it; a read-only peer reviews detail; the lead reviews adherence and integration. The head sees a rollup, never a review comment.
used_by_stages:
  - WF-FEATURE/DEV
  - WF-DEFECT/FIX
work_item:
  kind: task within a story
  artifact: STORY
  acceptance_source: the story's acceptance criteria, derived from the requirement
positions:
  human_owner:
    role: engineering-owner
    authority:
      - AP-09 protected-branch writes
      - Scope changes beyond the approved stories
    receives: escalations-and-approvals
  head:
    kind: agent
    role: engineering-director
    receives: rollup
    authority:
      - Plan and delegate the department's work
      - Request acceptance once every item reaches READY_FOR_INTEGRATION
      - Escalate to the human owner what the department cannot resolve
  lead: development-lead
  workers:
    - backend-developer
    - frontend-developer
    - data-engineer
  peer_reviewer: code-reviewer
  specialist_reviewers:
    - test-reviewer
    - performance-reviewer
    - reliability-reviewer
    - security-reviewer
    - dependency-reviewer
states:
  - ASSIGNED
  - IN_PROGRESS
  - SELF_VALIDATION
  - PEER_REVIEW
  - LEAD_REVIEW
  - CHANGES_REQUESTED
  - READY_FOR_INTEGRATION
  - ACCEPTANCE_REQUESTED
  - ACCEPTED
  - WITHDRAWN
  - ESCALATED
  - BLOCKED
transitions:
  ASSIGNED:
    start: IN_PROGRESS
    blocked: BLOCKED
  IN_PROGRESS:
    submit: SELF_VALIDATION
    blocked: BLOCKED
  SELF_VALIDATION:
    pass: PEER_REVIEW
    fail: IN_PROGRESS
  PEER_REVIEW:
    pass: LEAD_REVIEW
    minor: CHANGES_REQUESTED
    major: LEAD_REVIEW
    architecture_issue: ESCALATED
    requirement_issue: ESCALATED
  LEAD_REVIEW:
    pass: READY_FOR_INTEGRATION
    changes_required: CHANGES_REQUESTED
    architecture_issue: ESCALATED
    cannot_resolve: ESCALATED
  CHANGES_REQUESTED:
    resume: IN_PROGRESS
    limit_reached: ESCALATED
  READY_FOR_INTEGRATION:
    set_complete: ACCEPTANCE_REQUESTED
    sibling_pending: READY_FOR_INTEGRATION
  ESCALATED:
    resolved: IN_PROGRESS
    requirement_changed: ASSIGNED
    withdrawn: WITHDRAWN
  BLOCKED:
    unblocked: IN_PROGRESS
    decision_open: BLOCKED
  ACCEPTANCE_REQUESTED:
    dod_pass: ACCEPTED
    dod_fail: CHANGES_REQUESTED
    dod_requires_evidence: BLOCKED
rework:
  limit: 3
  on_limit: Escalate to development-lead, then the engineering owner. A third round means the acceptance criteria, the design or an unwritten disagreement is the problem, not the implementation.
escalation:
  order:
    - worker
    - peer_reviewer
    - lead
    - head
    - human_owner
  lateral:
    architecture_issue: solution-architect
    requirement_issue: product-manager
    security_issue: security-reviewer
    environment_issue: devops-engineer
rollup:
  produced_by: development-lead
  consumed_by: engineering-director
  fields:
    - work_item_set
    - status
    - streams
    - reviews
    - open_findings
    - rework_rounds
    - escalations
    - artifacts
    - next_gate
acceptance:
  conditions:
  # Department-generic only. An artifact-shaped condition belongs to the workflow
  # stage that produces that artifact, not to the department: the same cycle runs
  # inside WF-MIGRATION and WF-ONBOARDING, which produce no ARCH and no REQ.
    - tests_pass(unit)
    - tests_pass(integration)
    - agent_verdict(code-reviewer, pass)
    - no_unresolved_findings(high)
  requested_by: head
  determined_by: scripts/check_dod.py against acceptance.conditions
