# Generated against schemas/department-cycle.schema.json.
# The generic contract is policies/department-cycle.json; this instantiates it.
# Edit here, then run: python3 scripts/validate_plugin.py

id: CYCLE-DEVOPS
name: Platform execution
version: 1.0.0
department: platform
description: Pipeline, container or infrastructure change to accepted. The engineer is also the lead here, so the peer reviewer must be a different agent or the cycle has no independent check. A design that cannot be deployed as specified goes back to architecture rather than being worked around.
used_by_stages:
  - WF-FEATURE/CI
  - WF-FEATURE/DEPLOY
  - WF-RELEASE/DEPLOY
  - WF-MIGRATION/EXECUTE
work_item:
  kind: pipeline, container or infrastructure change
  artifact: REL
  acceptance_source: the deployment model in the approved architecture
positions:
  human_owner:
    role: engineering-owner
    authority:
      - AP-07 production infrastructure changes
      - AP-01 production deployment
    receives: escalations-and-approvals
  head:
    kind: agent
    role: engineering-director
    receives: rollup
    authority:
      - Plan and delegate the department's work
      - Request acceptance once every item reaches READY_FOR_INTEGRATION
      - Escalate to the human owner what the department cannot resolve
  lead: devops-engineer
  workers:
    - devops-engineer
  peer_reviewer: reliability-reviewer
  specialist_reviewers:
    - security-reviewer
states:
  - ASSIGNED
  - IN_PROGRESS
  - SELF_VALIDATION
  - PEER_REVIEW
  - LEAD_REVIEW
  - CHANGES_REQUESTED
  - READY_FOR_INTEGRATION
  - ACCEPTANCE_REQUESTED
  - ACCEPTED
  - WITHDRAWN
  - ESCALATED
  - BLOCKED
transitions:
  ASSIGNED:
    start: IN_PROGRESS
    blocked: BLOCKED
  IN_PROGRESS:
    submit: SELF_VALIDATION
    blocked: BLOCKED
  SELF_VALIDATION:
    pass: PEER_REVIEW
    fail: IN_PROGRESS
  PEER_REVIEW:
    pass: LEAD_REVIEW
    minor: CHANGES_REQUESTED
    major: LEAD_REVIEW
    architecture_issue: ESCALATED
    requirement_issue: ESCALATED
  LEAD_REVIEW:
    pass: READY_FOR_INTEGRATION
    changes_required: CHANGES_REQUESTED
    architecture_issue: ESCALATED
    cannot_resolve: ESCALATED
  CHANGES_REQUESTED:
    resume: IN_PROGRESS
    limit_reached: ESCALATED
  READY_FOR_INTEGRATION:
    set_complete: ACCEPTANCE_REQUESTED
    sibling_pending: READY_FOR_INTEGRATION
  ESCALATED:
    resolved: IN_PROGRESS
    requirement_changed: ASSIGNED
    withdrawn: WITHDRAWN
  BLOCKED:
    unblocked: IN_PROGRESS
    decision_open: BLOCKED
  ACCEPTANCE_REQUESTED:
    dod_pass: ACCEPTED
    dod_fail: CHANGES_REQUESTED
    dod_requires_evidence: BLOCKED
rework:
  limit: 3
  on_limit: Escalate to the engineering owner. A third round means the acceptance criteria, the design or an unwritten disagreement is the problem, not the implementation.
escalation:
  order:
    - worker
    - peer_reviewer
    - lead
    - head
    - human_owner
  lateral:
    architecture_issue: solution-architect
    security_issue: security-reviewer
rollup:
  produced_by: devops-engineer
  consumed_by: engineering-director
  fields:
    - work_item_set
    - status
    - streams
    - reviews
    - open_findings
    - rework_rounds
    - escalations
    - artifacts
    - next_gate
acceptance:
  conditions:
    - pipeline_passed(required)
    - agent_verdict(reliability-reviewer, pass)
    - agent_verdict(security-reviewer, pass)
    - no_unresolved_findings(high)
  requested_by: head
  determined_by: scripts/check_dod.py against acceptance.conditions
