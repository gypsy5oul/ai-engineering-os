# Generated against schemas/department-cycle.schema.json.
# The generic contract is policies/department-cycle.json; this instantiates it.
# Edit here, then run: python3 scripts/validate_plugin.py

id: CYCLE-SRE
name: Operations execution
version: 1.0.0
department: sre
description: Observability, runbook or investigation work to accepted. During an incident the same positions apply, with the incident commander as lead and every production action still requiring human authorization.
used_by_stages:
  - WF-FEATURE/OPS
  - WF-FEATURE/VERIFY
  - WF-INCIDENT/EVIDENCE
  - WF-INCIDENT/INVESTIGATE
  - WF-INCIDENT/RCA
  - WF-RELEASE/VERIFY
  - WF-MIGRATION/SAFETY
  - WF-MIGRATION/CLOSE
  - WF-FEATURE/READINESS
  - WF-RELEASE/READINESS
work_item:
  kind: observability change, runbook or investigation thread
  artifact: INC
  acceptance_source: the stated non-functional requirements, or the incident's symptom statement
positions:
  human_owner:
    role: on-call-owner
    authority:
      - AP-01 every production action during an incident
      - AP-11 production data access
    receives: escalations-and-approvals
  head:
    kind: agent
    role: engineering-director
    receives: rollup
    authority:
      - Plan and delegate the department's work
      - Request acceptance once every item reaches READY_FOR_INTEGRATION
      - Escalate to the human owner what the department cannot resolve
  lead: sre
  workers:
    - sre
  peer_reviewer: reliability-reviewer
  specialist_reviewers:
    - architecture-reviewer
states:
  - ASSIGNED
  - IN_PROGRESS
  - SELF_VALIDATION
  - PEER_REVIEW
  - LEAD_REVIEW
  - CHANGES_REQUESTED
  - READY_FOR_INTEGRATION
  - ACCEPTANCE_REQUESTED
  - ACCEPTED
  - WITHDRAWN
  - ESCALATED
  - BLOCKED
  - INCIDENT_MODE
transitions:
  ASSIGNED:
    start: IN_PROGRESS
    blocked: BLOCKED
  IN_PROGRESS:
    submit: SELF_VALIDATION
    blocked: BLOCKED
    incident_declared: INCIDENT_MODE
  SELF_VALIDATION:
    pass: PEER_REVIEW
    fail: IN_PROGRESS
  PEER_REVIEW:
    pass: LEAD_REVIEW
    minor: CHANGES_REQUESTED
    major: LEAD_REVIEW
    architecture_issue: ESCALATED
    requirement_issue: ESCALATED
  LEAD_REVIEW:
    pass: READY_FOR_INTEGRATION
    changes_required: CHANGES_REQUESTED
    architecture_issue: ESCALATED
    cannot_resolve: ESCALATED
  CHANGES_REQUESTED:
    resume: IN_PROGRESS
    limit_reached: ESCALATED
  READY_FOR_INTEGRATION:
    set_complete: ACCEPTANCE_REQUESTED
    sibling_pending: READY_FOR_INTEGRATION
  ESCALATED:
    resolved: IN_PROGRESS
    requirement_changed: ASSIGNED
    withdrawn: WITHDRAWN
  BLOCKED:
    unblocked: IN_PROGRESS
    decision_open: BLOCKED
  INCIDENT_MODE:
    recovered: SELF_VALIDATION
    handover_to_rca: ESCALATED
  ACCEPTANCE_REQUESTED:
    dod_pass: ACCEPTED
    dod_fail: CHANGES_REQUESTED
    dod_requires_evidence: BLOCKED
rework:
  limit: 3
  on_limit: Escalate to the on-call owner. A third round means the acceptance criteria, the design or an unwritten disagreement is the problem, not the implementation.
escalation:
  order:
    - worker
    - peer_reviewer
    - lead
    - head
    - human_owner
  lateral:
    architecture_issue: solution-architect
    requirement_issue: requirements-analyst
    security_issue: security-reviewer
rollup:
  produced_by: sre
  consumed_by: engineering-director
  fields:
    - work_item_set
    - status
    - streams
    - reviews
    - open_findings
    - rework_rounds
    - escalations
    - artifacts
    - next_gate
acceptance:
  conditions:
    - agent_verdict(reliability-reviewer, pass)
    - no_unresolved_findings(high)
  requested_by: head
  determined_by: scripts/check_dod.py against acceptance.conditions
