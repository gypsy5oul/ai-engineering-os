# Generated against schemas/department-cycle.schema.json.
# The generic contract is policies/department-cycle.json; this instantiates it.
# Edit here, then run: python3 scripts/validate_plugin.py

id: CYCLE-ARCH
name: Architecture execution
version: 1.0.0
department: architecture
description: Design section to reviewed architecture. The architect authors and the reviewer checks coverage; they are different agents and the reviewer's write scope is its own review record, so it cannot author the architecture it reviews. A finding that the requirement itself is wrong leaves the department rather than being designed around.
used_by_stages:
  - WF-FEATURE/FEAS
  - WF-FEATURE/ARCH
  - WF-AGENT-CHANGE/DESIGN
  - WF-CHANGE/ASSESS
  - WF-CHANGE/DECIDE
  - WF-MIGRATION/IMPACT
  - WF-MIGRATION/DESIGN
  - WF-AI-CHANGE/CONTRACT
  - WF-AI-CHANGE/DESIGN
work_item:
  kind: design section or decision
  artifact: ARCH
  acceptance_source: the approved requirements this design claims to satisfy
positions:
  human_owner:
    role: architecture-owner
    authority:
      - AP-02 architecture-changing decisions
      - AP-03 technology selection
      - AP-06 breaking API changes
    receives: escalations-and-approvals
  head:
    kind: agent
    role: engineering-director
    receives: rollup
    authority:
      - Plan and delegate the department's work
      - Request acceptance once every item reaches READY_FOR_INTEGRATION
      - Escalate to the human owner what the department cannot resolve
  lead: solution-architect
  workers:
    - solution-architect
  peer_reviewer: architecture-reviewer
  specialist_reviewers:
    - security-architect
    - sre
    - reliability-reviewer
states:
  - ASSIGNED
  - IN_PROGRESS
  - SELF_VALIDATION
  - PEER_REVIEW
  - LEAD_REVIEW
  - CHANGES_REQUESTED
  - READY_FOR_INTEGRATION
  - ACCEPTANCE_REQUESTED
  - ACCEPTED
  - WITHDRAWN
  - ESCALATED
  - BLOCKED
transitions:
  ASSIGNED:
    start: IN_PROGRESS
    blocked: BLOCKED
  IN_PROGRESS:
    submit: SELF_VALIDATION
    blocked: BLOCKED
  SELF_VALIDATION:
    pass: PEER_REVIEW
    fail: IN_PROGRESS
  PEER_REVIEW:
    pass: LEAD_REVIEW
    minor: CHANGES_REQUESTED
    major: LEAD_REVIEW
    architecture_issue: ESCALATED
    requirement_issue: ESCALATED
  LEAD_REVIEW:
    pass: READY_FOR_INTEGRATION
    changes_required: CHANGES_REQUESTED
    architecture_issue: ESCALATED
    cannot_resolve: ESCALATED
  CHANGES_REQUESTED:
    resume: IN_PROGRESS
    limit_reached: ESCALATED
  READY_FOR_INTEGRATION:
    set_complete: ACCEPTANCE_REQUESTED
    sibling_pending: READY_FOR_INTEGRATION
  ESCALATED:
    resolved: IN_PROGRESS
    requirement_changed: ASSIGNED
    withdrawn: WITHDRAWN
  BLOCKED:
    unblocked: IN_PROGRESS
    decision_open: BLOCKED
  ACCEPTANCE_REQUESTED:
    dod_pass: ACCEPTED
    dod_fail: CHANGES_REQUESTED
    dod_requires_evidence: BLOCKED
rework:
  limit: 3
  on_limit: Escalate to the architecture owner, because a third round on one decision means the forces are not agreed. A third round means the acceptance criteria, the design or an unwritten disagreement is the problem, not the implementation.
escalation:
  order:
    - worker
    - peer_reviewer
    - lead
    - head
    - human_owner
  lateral:
    requirement_issue: product-manager
    security_issue: security-architect
    operational_issue: sre
rollup:
  produced_by: solution-architect
  consumed_by: engineering-director
  fields:
    - work_item_set
    - status
    - streams
    - reviews
    - open_findings
    - rework_rounds
    - escalations
    - artifacts
    - next_gate
acceptance:
  conditions:
  # Department-generic only. An artifact-shaped condition belongs to the workflow
  # stage that produces that artifact, not to the department: the same cycle runs
  # inside WF-MIGRATION and WF-ONBOARDING, which produce no ARCH and no REQ.
    - agent_verdict(architecture-reviewer, pass)
  requested_by: head
  determined_by: scripts/check_dod.py against acceptance.conditions
